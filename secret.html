<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cat corner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="cat">
    <div class="cat-container">
        <div class="spinning-cat-gif">
            <div class="tenor-gif-embed" data-postid="27164337" data-share-method="host" data-aspect-ratio="1.49533" data-width="100%"><a href="https://tenor.com/view/cat-spinning-low-poly-meme-gif-27164337">Cat Spinning Sticker</a>from <a href="https://tenor.com/search/cat-stickers">Cat Stickers</a></div>
            <script type="text/javascript" async src="https://tenor.com/embed.js"></script>
        </div>
        <p class="cat-message">you have found the cat</p>
        <p class="cat-submessage">now be cursed with good luck for 7 years</p>
        <p id="timerResult" class="timer-result"></p>

        <!-- Name submission form -->
        <div id="submitScore" class="submit-score hidden">
            <input type="text" id="playerName" placeholder="Enter your name" maxlength="15">
            <button id="submitBtn" class="cta-button">Submit Time</button>
        </div>

        <!-- Leaderboard -->
        <div class="leaderboard">
            <h3 class="leaderboard-title">Fastest Cat Finders</h3>
            <ol id="leaderboardList" class="leaderboard-list">
                <li class="leaderboard-empty">No times recorded yet</li>
            </ol>
        </div>

        <a href="index.html" class="cta-button cat-back">Go Back Home</a>
        <a href="login.html" class="hidden-button" title="???">.</a>
    </div>

    <script>
        let currentElapsed = null;

        // Format milliseconds to readable time
        function formatTime(ms) {
            const seconds = Math.floor(ms / 1000);
            const minutes = Math.floor(seconds / 60);
            const hours = Math.floor(minutes / 60);

            if (hours > 0) {
                return `${hours}h ${minutes % 60}m ${seconds % 60}s`;
            } else if (minutes > 0) {
                return `${minutes}m ${seconds % 60}s`;
            } else {
                return `${seconds}.${Math.floor((ms % 1000) / 100)}s`;
            }
        }

        // Get leaderboard from localStorage
        function getLeaderboard() {
            const data = localStorage.getItem('catLeaderboard');
            return data ? JSON.parse(data) : [];
        }

        // Save leaderboard to localStorage
        function saveLeaderboard(leaderboard) {
            localStorage.setItem('catLeaderboard', JSON.stringify(leaderboard));
        }

        // Render leaderboard
        function renderLeaderboard() {
            const leaderboard = getLeaderboard();
            const list = document.getElementById('leaderboardList');

            if (leaderboard.length === 0) {
                list.innerHTML = '<li class="leaderboard-empty">No times recorded yet</li>';
                return;
            }

            list.innerHTML = leaderboard
                .sort((a, b) => a.time - b.time)
                .slice(0, 10)
                .map((entry, index) => {
                    const medal = index === 0 ? ' 🥇' : index === 1 ? ' 🥈' : index === 2 ? ' 🥉' : '';
                    return `<li><span class="lb-name">${entry.name}${medal}</span><span class="lb-time">${formatTime(entry.time)}</span></li>`;
                })
                .join('');
        }

        // Stop the timer and display result
        const startTime = localStorage.getItem('catHuntStart');
        if (startTime) {
            const endTime = Date.now();
            currentElapsed = endTime - parseInt(startTime);

            document.getElementById('timerResult').textContent = `Your time: ${formatTime(currentElapsed)}`;
            document.getElementById('submitScore').classList.remove('hidden');

            // Clear the timer so it resets on next visit to home
            localStorage.removeItem('catHuntStart');
        }

        // Submit score
        document.getElementById('submitBtn').addEventListener('click', function() {
            const nameInput = document.getElementById('playerName');
            const name = nameInput.value.trim() || 'Anonymous';

            if (currentElapsed) {
                const leaderboard = getLeaderboard();
                leaderboard.push({ name: name, time: currentElapsed });
                saveLeaderboard(leaderboard);
                renderLeaderboard();

                // Hide submit form
                document.getElementById('submitScore').classList.add('hidden');
                currentElapsed = null;
            }
        });

        // Allow Enter key to submit
        document.getElementById('playerName').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('submitBtn').click();
            }
        });

        // Initial render
        renderLeaderboard();
    </script>
</body>
</html>
